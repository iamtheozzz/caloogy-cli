[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "caloogy-chat"
dynamic = ["version"]
description = "Command line for work.caloogy.com (Caloogy Chat) — for you and for Claude Code / Codex"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
caloogy-chat = "caloogy_chat.cli:main"

[tool.setuptools.dynamic]
version = { attr = "caloogy_chat.__version__" }

[tool.setuptools.package-data]
caloogy_chat = ["SKILL.md"]
